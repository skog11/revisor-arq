name: Deploy a Vercel

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy producción
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar Vercel CLI
        run: npm install -g vercel@latest

      - name: Instalar dependencias
        working-directory: app
        run: npm ci

      - name: Tests unitarios (guardrails críticos)
        working-directory: app
        run: npm run test

      - name: Instalar Playwright (chromium)
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Deploy a Vercel (producción)
        working-directory: app
        run: vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}

      - name: E2E smoke tests contra producción
        working-directory: app
        run: npm run e2e:prod -- --grep "carga|modos|landing|mobile" --project=chromium
        env:
          E2E_URL: https://revisor-arq.vercel.app
        continue-on-error: true  # no bloquear deploy por flakiness de LLM
